name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: MUI ${{ matrix.mui }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MUI has no v8: the project jumped from 7 to 9 to align with MUI X.
        mui: [6, 7, 9]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install @mui/material@${{ matrix.mui }}
        run: npm install --no-save --no-audit --no-fund "@mui/material@${{ matrix.mui }}" "@mui/icons-material@${{ matrix.mui }}"
      - run: node -p "'@mui/material ' + require('@mui/material/package.json').version"
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:run

  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        example: [login-page, user-edit-dialog]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test examples/${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          npm ci
          npx vitest run
